# Linked to ~/.config/lan-mouse/config.toml by hosts/laptop/default.nix.
# Left Ctrl+Right Ctrl gets the cursor back if it sticks, e.g. after Mod+M into
# the other machine's lock screen, which hides the edge, so it can't send it
# back. While the other machine is locked, the edge is off (modules/home/lan-mouse.nix).
# Also D+K held, the home-row mods (config/kanata/keymap.kbd): opposite hands,
# so kanata holds both.
release_bind = [ "KeyLeftCtrl", "KeyRightCtrl" ]

# Certificate of the desktop, see "Sharing the mouse and keyboard" in the README.
[authorized_fingerprints]
"5b:86:f7:62:59:5b:38:0a:77:24:00:db:80:1b:6c:b0:76:b4:ad:ce:80:1d:d1:91:21:90:fa:81:c8:9d:3d:eb" = "desktop"

[[clients]]
position = "top"
hostname = "desktop"
activate_on_startup = true
