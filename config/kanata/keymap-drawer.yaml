# keymap-drawer config for the kanata keymap viewer (Mod+Ctrl+/,
# modules/home/kanata-keymap.nix), keyed on keymap.kbd's alias names. Its kanata
# parser can't read deftemplate/t!, so the home-row mods get their legends here.
parse_config:
  raw_binding_map:
    "@hra": {t: A, h: Super}
    "@hrs": {t: S, h: Alt}
    "@hrd": {t: D, h: Ctrl}
    "@hrf": {t: F, h: Shift}
    "@hrj": {t: J, h: Shift}
    "@hrk": {t: K, h: Ctrl}
    "@hrl": {t: L, h: Alt}
    "@hr;": {t: ";", h: Super}
