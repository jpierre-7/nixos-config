onboarding = false
[theme]
name = "terminal"
auto_switch = false

# The agent cards column takes the sidebar's place (modules/home/herdr.nix).
[ui]
sidebar_start_collapsed = true
sidebar_collapsed_mode = "hidden"
# No frame around the outside, so the panel reaches the window's edge like the
# desktop app's sidebar, with a single divider beside it.
pane_outer_borders = false
pane_gaps = false

[terminal]
default_shell = "fish"
new_cwd = "follow"

[session]
resume_agents_on_restore = true

[keys]
prefix = "ctrl+space"
goto = "prefix+space"
new_tab = "prefix+t"
split_vertical = "prefix+|"
split_horizontal = "prefix+minus"
copy_mode = "prefix+c"
navigate_workspace_up = "k"
navigate_workspace_down = "j"
# Herdr's picker highlights rows in the hidden sidebar, so prefix+w goes to the
# agent cards column instead.
workspace_picker = "prefix+shift+w"
# That key is rename_workspace's by default.
rename_workspace = "prefix+shift+s"

# Diff of the focused pane's Claude session in a split (modules/home/claude.nix)
[[keys.command]]
key = "prefix+d"
type = "shell"
command = "claude-session-diff toggle"
description = "Claude session diff"

# The focused agent's session as a live graph (zoetrope, modules/home/herdr.nix)
[[keys.command]]
key = "prefix+shift+z"
type = "plugin_action"
command = "furkankly.zoetrope.open"
description = "zoetrope: session graph"

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "local.agent-cards.toggle"
description = "Toggle agent cards"

[[keys.command]]
key = "prefix+w"
type = "plugin_action"
command = "local.agent-cards.navigate"
description = "Navigate agent cards"
